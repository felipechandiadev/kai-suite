name: kai-screen-android

# CI only on main when this app (or its client package) changes — not on suite tags / root bumps.
on:
  push:
    branches:
      - main
    paths:
      - "kai-screen-android/**"
      - "packages/customer-display-client/**"
      - ".github/workflows/kai-screen-android.yml"
  pull_request:
    paths:
      - "kai-screen-android/**"
      - "packages/customer-display-client/**"
      - ".github/workflows/kai-screen-android.yml"

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        working-directory: kai-screen-android
        run: chmod +x gradlew
      - name: Assemble debug and unit tests
        working-directory: kai-screen-android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: customer-display-client tests
        run: |
          npm ci
          npm test -w @kai/customer-display-client
