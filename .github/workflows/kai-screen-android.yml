name: kai-screen-android

on:
  push:
    paths:
      - "kai-screen-android/**"
      - "packages/customer-display-client/**"
      - ".github/workflows/kai-screen-android.yml"
  pull_request:
    paths:
      - "kai-screen-android/**"
      - "packages/customer-display-client/**"
      - ".github/workflows/kai-screen-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        working-directory: kai-screen-android
        run: chmod +x gradlew
      - name: Assemble debug and unit tests
        working-directory: kai-screen-android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: customer-display-client tests
        working-directory: packages/customer-display-client
        run: npm ci && npm test
