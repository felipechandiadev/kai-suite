name: kai-printers-android

on:
  push:
    paths:
      - "kai-printers-android/**"
      - "packages/kai-printers-brand/**"
      - "packages/print-service-client/fixtures/**"
      - ".github/workflows/kai-printers-android.yml"
  pull_request:
    paths:
      - "kai-printers-android/**"
      - "packages/kai-printers-brand/**"
      - "packages/print-service-client/fixtures/**"
      - ".github/workflows/kai-printers-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        working-directory: kai-printers-android
        run: chmod +x gradlew
      - name: Assemble debug
        working-directory: kai-printers-android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
