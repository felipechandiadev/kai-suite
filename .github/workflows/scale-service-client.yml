name: scale-service-client

# CI only on main when this package changes — not on suite tags / root bumps.
on:
  push:
    branches:
      - main
    paths:
      - "packages/scale-service-client/**"
      - ".github/workflows/scale-service-client.yml"
  pull_request:
    paths:
      - "packages/scale-service-client/**"
      - ".github/workflows/scale-service-client.yml"

jobs:
  test:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: scale-service-client tests
        run: npm test -w @kai/scale-service-client
