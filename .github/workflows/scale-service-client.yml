name: scale-service-client

on:
  push:
    paths:
      - "packages/scale-service-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scale-service-client.yml"
  pull_request:
    paths:
      - "packages/scale-service-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scale-service-client.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: scale-service-client tests
        run: npm test -w @kai/scale-service-client
