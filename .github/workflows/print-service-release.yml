name: kai-printers-desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "kaiprinters-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kai-printers-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kai-printers-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kai-printers-desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: kai-printers-desktop
        run: npm ci

      - name: Download SumatraPDF (Windows bundle)
        if: matrix.os == 'windows-latest'
        working-directory: kai-printers-desktop
        run: node scripts/fetch-sumatra-windows.mjs

      - name: Build KaiPrinters (${{ matrix.target }})
        working-directory: kai-printers-desktop
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          CI: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            kai-printers-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            kai-printers-desktop/src-tauri/target/release/bundle/macos/*.app
            kai-printers-desktop/src-tauri/target/release/bundle/nsis/*.exe
            kai-printers-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
