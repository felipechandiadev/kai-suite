name: kai-printers-desktop

on:
  push:
    paths:
      - "kai-printers-desktop/**"
      - ".github/workflows/kai-printers-desktop.yml"
  pull_request:
    paths:
      - "kai-printers-desktop/**"
      - ".github/workflows/kai-printers-desktop.yml"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kai-printers-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: kai-printers-desktop
        run: npm ci
      - name: Build Vite frontend
        working-directory: kai-printers-desktop
        run: npm run build
      - name: Download SumatraPDF (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: kai-printers-desktop
        run: node scripts/fetch-sumatra-windows.mjs
      - name: Cargo check (cross-target)
        run: cargo check --target ${{ matrix.target }}
