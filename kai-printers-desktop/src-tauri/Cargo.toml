[package]
name = "print-service"
version = "1.0.4"
description = "KaiPrinters — agente local de impresión (Tauri)"
authors = ["Felipe Chandía Castillo"]
edition = "2021"

[lib]
name = "print_service_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
  "fs",
  "io-util",
  "process",
] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
http = "1"
once_cell = "1"
printpdf = { version = "0.7", features = ["embedded_images"] }
image = "0.24"
barcoders = "2.0"
rxing = { version = "0.9", default-features = false, features = ["pdf417", "encoders", "encoding_rs", "image"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
] }
