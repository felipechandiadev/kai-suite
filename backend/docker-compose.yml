version: '3.8'

services:
  # PostgreSQL + PostGIS (requerido por e-shop-delivery: zonas/geom).
  # Si el volumen postgres_data ya existía con postgres:15-alpine sin extensión,
  # hay que recrearlo o activar PostGIS a mano: docs/project/POSTGIS-DELIVERY.md
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: flow-store-postgres
    environment:
      POSTGRES_DB: kai-demo
      POSTGRES_USER: kai
      POSTGRES_PASSWORD: kai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - flow-store-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kai -d kai-demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flow-store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flow-store-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flow Store Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-store-backend
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: kai
      DB_PASSWORD: kai123
      DB_DATABASE: kai-demo
      DB_SYNCHRONIZE: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flow-store-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # PgAdmin (Database Management - Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flow-store-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowstore.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - flow-store-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Redis Commander (Redis Management - Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: flow-store-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - flow-store-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  flow-store-network:
    driver: bridge