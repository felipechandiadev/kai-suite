<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="268 8 256 472" role="img" aria-label="Kai Stock — inventario móvil">
  <defs>
    <linearGradient id="phone-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="45%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1824"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65F3FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#65F3FF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- phone mockup -->
  <g>
    <!-- shell -->
    <rect x="286" y="28" width="228" height="444" rx="38" fill="url(#phone-shell)" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- side buttons -->
    <rect x="278" y="120" width="4" height="44" rx="2" fill="#27272a"/>
    <rect x="278" y="176" width="4" height="64" rx="2" fill="#27272a"/>
    <rect x="518" y="148" width="4" height="72" rx="2" fill="#27272a"/>
    <!-- screen -->
    <rect x="298" y="44" width="204" height="412" rx="28" fill="#000"/>
    <rect x="298" y="44" width="204" height="412" rx="28" fill="url(#screen-glow)"/>
    <!-- dynamic island -->
    <rect x="362" y="56" width="76" height="18" rx="9" fill="#000"/>
    <!-- status bar -->
    <text x="316" y="88" fill="#9ca3af" font-size="9" font-family="Inter, system-ui, sans-serif" font-weight="600">9:41</text>
    <text x="486" y="88" text-anchor="end" fill="#9ca3af" font-size="9" font-family="Inter, system-ui, sans-serif">5G</text>

    <!-- app header -->
    <text x="400" y="118" text-anchor="middle" fill="#f5f5f7" font-size="15" font-weight="700" font-family="Inter, system-ui, sans-serif">Stock</text>
    <text x="400" y="134" text-anchor="middle" fill="#65F3FF" font-size="9.5" font-weight="600" font-family="Inter, system-ui, sans-serif" letter-spacing="0.12em">INVENTARIO MÓVIL</text>

    <!-- search -->
    <rect x="312" y="148" width="176" height="30" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(101,243,255,0.25)"/>
    <circle cx="328" cy="163" r="5" fill="none" stroke="#65F3FF" stroke-width="1.5"/>
    <line x1="332" y1="167" x2="336" y2="171" stroke="#65F3FF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="346" y="167" fill="#6b7280" font-size="10" font-family="Inter, system-ui, sans-serif">Buscar SKU…</text>

    <!-- tabs -->
    <rect x="312" y="188" width="52" height="22" rx="8" fill="rgba(101,243,255,0.18)" stroke="#65F3FF" stroke-opacity="0.5"/>
    <text x="338" y="203" text-anchor="middle" fill="#e5e7eb" font-size="9" font-weight="600" font-family="Inter, system-ui, sans-serif">SKU</text>
    <rect x="372" y="188" width="52" height="22" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="398" y="203" text-anchor="middle" fill="#9ca3af" font-size="9" font-family="Inter, system-ui, sans-serif">Conteo</text>
    <rect x="432" y="188" width="56" height="22" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="460" y="203" text-anchor="middle" fill="#9ca3af" font-size="9" font-family="Inter, system-ui, sans-serif">Movim.</text>

    <!-- list items -->
    <g>
      <rect x="312" y="224" width="176" height="54" rx="12" fill="url(#accent)" stroke="rgba(101,243,255,0.35)"/>
      <rect x="324" y="236" width="36" height="30" rx="8" fill="rgba(0,0,0,0.35)"/>
      <text x="342" y="255" text-anchor="middle" fill="#65F3FF" font-size="8" font-weight="700" font-family="Inter, system-ui, sans-serif">SKU</text>
      <text x="368" y="244" fill="#f5f5f7" font-size="10" font-weight="600" font-family="Inter, system-ui, sans-serif">Polera básica M</text>
      <text x="368" y="258" fill="#9ca3af" font-size="8.5" font-family="Inter, system-ui, sans-serif">Bodega principal</text>
      <rect x="448" y="238" width="28" height="22" rx="8" fill="rgba(101,243,255,0.22)"/>
      <text x="462" y="253" text-anchor="middle" fill="#65F3FF" font-size="10" font-weight="700" font-family="Inter, system-ui, sans-serif">48</text>
    </g>
    <g>
      <rect x="312" y="286" width="176" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="324" y="298" width="36" height="30" rx="8" fill="rgba(0,0,0,0.35)"/>
      <text x="342" y="317" text-anchor="middle" fill="#9ca3af" font-size="8" font-weight="700" font-family="Inter, system-ui, sans-serif">SKU</text>
      <text x="368" y="306" fill="#e5e7eb" font-size="10" font-weight="600" font-family="Inter, system-ui, sans-serif">Jean slim 32</text>
      <text x="368" y="320" fill="#9ca3af" font-size="8.5" font-family="Inter, system-ui, sans-serif">Sala venta</text>
      <rect x="448" y="300" width="28" height="22" rx="8" fill="rgba(255,255,255,0.06)"/>
      <text x="462" y="315" text-anchor="middle" fill="#d1d5db" font-size="10" font-weight="700" font-family="Inter, system-ui, sans-serif">12</text>
    </g>
    <g>
      <rect x="312" y="348" width="176" height="54" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="324" y="360" width="36" height="30" rx="8" fill="rgba(0,0,0,0.35)"/>
      <text x="342" y="379" text-anchor="middle" fill="#9ca3af" font-size="8" font-weight="700" font-family="Inter, system-ui, sans-serif">SKU</text>
      <text x="368" y="368" fill="#e5e7eb" font-size="10" font-weight="600" font-family="Inter, system-ui, sans-serif">Zapatilla urbana</text>
      <text x="368" y="382" fill="#9ca3af" font-size="8.5" font-family="Inter, system-ui, sans-serif">Bodega principal</text>
      <rect x="448" y="362" width="28" height="22" rx="8" fill="rgba(255,255,255,0.06)"/>
      <text x="462" y="377" text-anchor="middle" fill="#d1d5db" font-size="10" font-weight="700" font-family="Inter, system-ui, sans-serif">7</text>
    </g>

    <!-- home indicator -->
    <rect x="368" y="438" width="64" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>
</svg>
